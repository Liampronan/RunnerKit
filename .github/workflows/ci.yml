name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check bash syntax
        run: |
          for f in bin/runnerkit install.sh tests/*.sh tests/stubs/*; do
            bash -n "$f"
          done
      - name: Run ShellCheck
        run: shellcheck -s bash bin/runnerkit install.sh tests/*.sh tests/stubs/*

  test-linux:
    name: Stub tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run stub test harness
        run: ./tests/run_tests.sh

  test-macos-stubs:
    name: Stub tests (macOS Bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Print stock /bin/bash version
        run: /bin/bash --version
      - name: Run stub test harness under /bin/bash 3.2
        run: /bin/bash ./tests/run_tests.sh

  test-macos-launchd:
    name: Launchd integration (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise real launchctl with dummy runner service
        run: /bin/bash ./tests/macos_launchd_test.sh
